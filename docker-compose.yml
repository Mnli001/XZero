version: "3.9"

services:
  # Local dev / Linux: API + backtest + paper trading (MT5 in mock mode).
  # Production: dashboard on Vercel, this stack (+ mt5 bridge) on a Windows VPS.
  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: sqlite:///./data/xzero.db
    volumes:
      - ./backend/data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  web:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE: http://api:8000
    depends_on:
      - api
